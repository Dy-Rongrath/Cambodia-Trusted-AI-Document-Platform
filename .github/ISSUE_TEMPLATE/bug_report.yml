name: Bug Report
description: Create a report to help us fix a bug or issue.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure no secrets or real personal/government data are included in this issue.
        Note: If this is a security vulnerability, do NOT use this form — see SECURITY.md to report confidentially.
  - type: checkboxes
    id: non_security_check
    attributes:
      label: Vulnerability Confirmation
      options:
        - label: I confirm that this is a bug report and NOT a security vulnerability disclosure.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: input
    id: affected_component
    attributes:
      label: Affected Component or Service
      placeholder: e.g. apps/backend, apps/ai-service, apps/frontend, infra/docker
    validations:
      required: false
  - type: input
    id: repo_version
    attributes:
      label: Repository Commit or Version
      placeholder: e.g. commit hash or branch (e.g. main @ 6c1f33c)
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behaviour.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS Sequoia, Ubuntu 24.04, Windows 11
    validations:
      required: false
  - type: input
    id: cpu_arch
    attributes:
      label: CPU Architecture / Apple Silicon / ARM64 Compatibility
      placeholder: e.g. Apple Silicon (ARM64), Linux ARM64, x86_64
    validations:
      required: false
  - type: input
    id: node_python_version
    attributes:
      label: Node.js / Python / Browser Version
      placeholder: e.g. Node 24.15.0, Python 3.12, Chrome 125
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant terminal or browser log output here. Remove all secrets, tokens, or personal data!
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: sanitization_confirmation
    attributes:
      label: Security & Privacy Confirmation
      options:
        - label: I confirm that no secrets, passwords, private keys, API tokens, or real personal/government data are included in this issue report.
          required: true
