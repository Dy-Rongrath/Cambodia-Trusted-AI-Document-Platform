name: Documentation Issue
description: Report an inaccuracy, clarification, or missing detail in documentation.
title: '[DOCS]: '
labels: ['documentation']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep our documentation accurate and aligned!
  - type: input
    id: doc_path
    attributes:
      label: Target Document Path
      placeholder: e.g. ARCHITECTURE.md, TESTING.md, docs/threat-model.md
    validations:
      required: true
  - type: dropdown
    id: doc_category
    attributes:
      label: Documentation Issue Category
      options:
        - 'General documentation improvement'
        - 'Legal or licensing correction'
        - 'Security documentation correction'
        - 'Time-sensitive version or status information'
    validations:
      required: true
  - type: textarea
    id: issue_details
    attributes:
      label: Incorrect or Unclear Section
      description: Describe what section is incorrect, outdated, or hard to understand.
    validations:
      required: true
  - type: textarea
    id: suggested_correction
    attributes:
      label: Suggested Correction
      description: Proposed replacement text or clarification.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Source or Evidence
      description: Reference ADRs, roadmap phases, official legal text, or specification links supporting this fix.
    validations:
      required: false
