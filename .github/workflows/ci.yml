name: Phase 1 CI

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Phase 1 Scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate repository safety and policy compliance
        run: |
          echo "Checking for committed secret .env files..."
          ! git ls-files | grep -E '^\.env$|^\.env\.(local|production|staging)$'
          echo "Checking for prohibited object storage services..."
          ! grep -rnI -E 'minio|aistor|seaweedfs|garage' infra/docker/ apps/
          echo "Checking for business Prisma models..."
          ! grep -E 'model (Document|User|Tenant|Organization)' apps/backend/prisma/schema.prisma

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Node Workspaces Quality Gates (Docker)
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app node:24-alpine3.21 sh -c "
            npm ci &&
            npm run format:check &&
            npm run lint &&
            npm run build --workspace=packages/shared-types &&
            npm run prisma:generate --workspace=apps/backend &&
            npm run typecheck &&
            npm run test &&
            npm run build
          "

      - name: AI Service Quality Gates (Docker)
        run: |
          docker run --rm -v ${{ github.workspace }}/apps/ai-service:/app -w /app ghcr.io/astral-sh/uv:0.5-python3.12-alpine sh -c "
            uv sync --frozen --extra dev &&
            uv run ruff check . &&
            uv run ruff format --check . &&
            uv run mypy src &&
            uv run pytest
          "

      - name: Build Docker images
        run: docker compose build

      - name: Start default services
        run: docker compose up -d

      - name: Wait for service health
        run: |
          echo "Waiting for postgres and backend health..."
          timeout 60s sh -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" trusted-ai-postgres)" = "healthy" ]; do sleep 2; done'
          timeout 60s sh -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" trusted-ai-backend)" = "healthy" ]; do sleep 2; done'

      - name: Verify Backend Health Endpoint
        run: |
          curl --fail http://127.0.0.1:3000/health

      - name: Verify AI Service Health Endpoint (Internal)
        run: |
          docker compose exec -T ai-service python -c 'import urllib.request; resp = urllib.request.urlopen("http://localhost:8000/health"); print(resp.read().decode())'

      - name: Verify Frontend HTTP response
        run: |
          curl --fail http://127.0.0.1:4200/

      - name: Run Backend Database Connectivity Check
        run: |
          docker compose exec -T backend npm run db:check --workspace=apps/backend

      - name: Confirm Keycloak absent from default stack
        run: |
          ! docker ps --format '{{.Names}}' | grep -q trusted-ai-keycloak

      - name: Validate Keycloak under auth profile
        run: |
          docker compose --profile auth up -d keycloak
          timeout 60s sh -c 'until [ "$(docker inspect --format="{{.State.Status}}" trusted-ai-keycloak)" = "running" ]; do sleep 2; done'
          docker compose --profile auth stop keycloak

      - name: Clean up Compose services
        if: always()
        run: docker compose --profile auth down --remove-orphans
