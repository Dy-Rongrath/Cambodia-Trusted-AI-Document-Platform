name: Phase 1 CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # SECTION 1: CI QUALITY GATES (Run in parallel on all PRs and pushes)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Job 1: Repository Policy & Container Security Checks (~30s)
  # ---------------------------------------------------------------------------
  policy-and-security:
    name: Repository Policy & Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Validate repository safety and policy compliance
        timeout-minutes: 2
        run: |
          echo "=== Checking for committed .env secret files (tracked-file scan) ==="
          LEAKED=$(git ls-files | grep -E '^(\.env|\.env\.[^.]+)$' | grep -vE '(\.env\.example|\.example)$' || true)
          if [ -n "$LEAKED" ]; then
            echo "FAIL: Tracked secret environment files detected:"
            echo "$LEAKED"
            exit 1
          fi
          echo "PASS: No committed .env secret files."

          echo "=== Checking for private key material in tracked files ==="
          PRIVATE_KEY_FILES=$(git ls-files | grep -v '^\.github/workflows/ci-cd\.yml$' | xargs -r grep -lI 'BEGIN RSA PRIVATE KEY\|BEGIN EC PRIVATE KEY\|BEGIN OPENSSH PRIVATE KEY\|-----BEGIN PRIVATE KEY-----' 2>/dev/null || true)
          if [ -n "$PRIVATE_KEY_FILES" ]; then
            echo "FAIL: Private key material detected in tracked files."
            echo "$PRIVATE_KEY_FILES"
            exit 1
          fi
          echo "PASS: No private key material."

          echo "=== Checking for prohibited object-storage services ==="
          if grep -rnI -E 'minio|aistor|seaweedfs|garage' infra/docker/ apps/ 2>/dev/null; then
            echo "FAIL: Object-storage service reference detected."
            exit 1
          fi
          echo "PASS: No object-storage services."

          echo "=== Checking for any Prisma model declaration ==="
          if grep -Eq '^[[:space:]]*model[[:space:]]+' apps/backend/prisma/schema.prisma; then
            echo "FAIL: Prisma model declaration found in Phase 1 schema."
            grep -En '^[[:space:]]*model[[:space:]]+' apps/backend/prisma/schema.prisma
            exit 1
          fi
          echo "PASS: No Prisma models in schema.prisma."

          echo "=== Checking for Prisma migrations directory ==="
          if [ -d apps/backend/prisma/migrations ]; then
            echo "FAIL: Prisma migrations directory found — not permitted in Phase 1."
            exit 1
          fi
          echo "PASS: No Prisma migrations directory."

          echo "=== Checking for machine-specific absolute paths in tracked files ==="
          if git ls-files | xargs -r grep -lI 'file:///Users/\|file:///home/\|/Users/[A-Za-z]' 2>/dev/null | grep -v '.md$' | grep -v 'DEVELOPMENT.md\|README.md'; then
            echo "WARN: Potential machine-specific path detected — review output above."
          fi

          echo "=== All repository policy checks passed. ==="

      - name: Validate Docker Compose configuration
        timeout-minutes: 2
        run: |
          echo "=== Validating docker compose config syntax ==="
          docker compose config

          echo "=== Checking for privileged containers ==="
          if docker compose config | grep -E 'privileged:\s*true'; then
            echo "FAIL: Privileged container detected."
            exit 1
          fi
          echo "PASS: No privileged containers."

          echo "=== Checking for host network mode ==="
          if docker compose config | grep -E 'network_mode:\s*host'; then
            echo "FAIL: host network mode detected."
            exit 1
          fi
          echo "PASS: No host networking."

          echo "=== Checking for Docker socket mounts ==="
          if docker compose config | grep -E '/var/run/docker\.sock'; then
            echo "FAIL: Docker socket mount detected."
            exit 1
          fi
          echo "PASS: No Docker socket mounts."

          echo "=== Checking backend port binding (must be 127.0.0.1) ==="
          if docker compose config | grep -A2 'trusted-ai-backend' | grep -E '"?0\.0\.0\.0:[0-9]+:[0-9]+"?'; then
            echo "FAIL: Backend port is not bound to 127.0.0.1."
            exit 1
          fi
          echo "PASS: Backend port bound to 127.0.0.1."

          echo "=== Confirming PostgreSQL has no published host port ==="
          POSTGRES_PORTS=$(docker compose config --format json | python3 -c "import json,sys; cfg=json.load(sys.stdin); print(cfg.get('services',{}).get('postgres',{}).get('ports','none'))")
          if [ "$POSTGRES_PORTS" != "none" ] && [ "$POSTGRES_PORTS" != "[]" ]; then
            echo "FAIL: PostgreSQL has published host ports: $POSTGRES_PORTS"
            exit 1
          fi
          echo "PASS: PostgreSQL has no published host port."

          echo "=== Confirming AI service has no published host port ==="
          AI_PORTS=$(docker compose config --format json | python3 -c "import json,sys; cfg=json.load(sys.stdin); print(cfg.get('services',{}).get('ai-service',{}).get('ports','none'))")
          if [ "$AI_PORTS" != "none" ] && [ "$AI_PORTS" != "[]" ]; then
            echo "FAIL: AI service has published host ports: $AI_PORTS"
            exit 1
          fi
          echo "PASS: AI service has no published host port."

          echo "=== All container security checks passed. ==="

  # ---------------------------------------------------------------------------
  # Job 2: Node.js Workspaces Quality & Security Audit (~1.5m)
  # ---------------------------------------------------------------------------
  node-quality:
    name: Node Workspaces & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Node Workspaces Quality Gates (Docker)
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app node:24.15.0-alpine3.22 sh -c "
            set -e
            npm ci &&
            npm run format:check &&
            npm run lint &&
            npm run build --workspace=packages/shared-types &&
            npm run prisma:generate --workspace=apps/backend &&
            npm run typecheck &&
            npm run test:ci --workspace=apps/backend &&
            npm run build --workspace=apps/backend &&
            echo '=== Full audit (all deps) ===' &&
            npm run audit:full &&
            echo '=== Runtime-only audit (omit dev) ===' &&
            npm run audit:production
          "

  # ---------------------------------------------------------------------------
  # Job 3: Frontend Unit Tests (~1m)
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Frontend Tests (Docker test stage)
        run: |
          docker build \
            --target test \
            --build-arg CI=true \
            -f apps/frontend/Dockerfile \
            --progress=plain \
            .

  # ---------------------------------------------------------------------------
  # Job 4: AI Service Quality Gates & Audit (~1.5m)
  # ---------------------------------------------------------------------------
  ai-service-quality:
    name: AI Service Quality & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: AI Service Quality Gates (Docker)
        run: |
          docker run --rm -v ${{ github.workspace }}/apps/ai-service:/app -w /app ghcr.io/astral-sh/uv:0.12.1-python3.12-trixie-slim sh -c "
            set -e
            uv sync --frozen --extra dev &&
            uv run ruff check . &&
            uv run ruff format --check . &&
            uv run mypy src &&
            uv run pytest &&
            uv lock --check
          "

      - name: AI Service Production Dependency Audit
        run: |
          docker run --rm -v ${{ github.workspace }}/apps/ai-service:/workspace -w /workspace --entrypoint sh ghcr.io/astral-sh/uv:0.12.1-python3.12-trixie-slim -c "
            set -e
            uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt >/dev/null
            uvx pip-audit==2.10.1 --strict --progress-spinner off --require-hashes --disable-pip -r /tmp/requirements.txt
          "

  # ---------------------------------------------------------------------------
  # Job 5: Runtime Smoke Test & Stack Integration (~3m)
  # ---------------------------------------------------------------------------
  integration-smoke-test:
    name: Integration & Runtime Smoke Test
    needs: [policy-and-security, node-quality, frontend-tests, ai-service-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Build Docker images
        timeout-minutes: 10
        run: docker compose build

      - name: Build, smoke-test, and scan production runtime images
        timeout-minutes: 10
        env:
          RUNTIME_SCAN_IMAGE: docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        run: ./scripts/docker/runtime-smoke.sh

      - name: Start default services
        timeout-minutes: 3
        run: docker compose up -d

      - name: Wait for PostgreSQL health
        timeout-minutes: 2
        run: |
          timeout 60s sh -c '
            until [ "$(docker inspect --format={{.State.Health.Status}} trusted-ai-postgres 2>/dev/null)" = "healthy" ]; do
              printf "."
              sleep 2
            done
          '
          echo ""
          echo "PostgreSQL is healthy."

      - name: Wait for backend health
        timeout-minutes: 2
        run: |
          timeout 60s sh -c '
            until [ "$(docker inspect --format={{.State.Health.Status}} trusted-ai-backend 2>/dev/null)" = "healthy" ]; do
              printf "."
              sleep 2
            done
          '
          echo ""
          echo "Backend is healthy."

      - name: Verify Backend Health Endpoint
        run: curl --fail http://127.0.0.1:3000/health

      - name: Verify AI Service Health Endpoint (Internal)
        run: docker compose exec -T ai-service python -c 'import urllib.request; resp = urllib.request.urlopen("http://localhost:8000/health"); print(resp.read().decode())'

      - name: Verify Frontend HTTP response
        run: curl --fail http://127.0.0.1:4200/

      - name: Run Backend Database Connectivity Check (SELECT 1)
        run: docker compose exec -T backend npm run db:check --workspace=apps/backend

      - name: Confirm Keycloak absent from default stack
        run: |
          if docker ps --format '{{.Names}}' | grep -q trusted-ai-keycloak; then
            echo "FAIL: Keycloak container found running outside auth profile."
            exit 1
          fi
          echo "PASS: Keycloak not running in default stack."

      - name: Start Keycloak under auth profile
        timeout-minutes: 2
        run: docker compose --profile auth up -d keycloak

      - name: Wait for Keycloak HTTP readiness (/health/ready on port 9000)
        timeout-minutes: 3
        run: |
          echo "Waiting for Keycloak health/ready endpoint..."
          timeout 120s sh -c '
            until [ "$(docker inspect --format={{.State.Health.Status}} trusted-ai-keycloak 2>/dev/null)" = "healthy" ]; do
              printf "."
              sleep 5
            done
          ' || {
            echo ""
            echo "FAIL: Keycloak did not become healthy within timeout."
            echo "=== Keycloak container logs ==="
            docker compose --profile auth logs keycloak --tail=50
            exit 1
          }
          echo ""
          echo "PASS: Keycloak is ready."

      - name: Stop Keycloak
        run: docker compose --profile auth stop keycloak

      - name: Capture service logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose --profile auth ps || true
          echo "=== backend logs ==="
          docker compose logs backend --tail=30 || true
          echo "=== ai-service logs ==="
          docker compose logs ai-service --tail=30 || true
          echo "=== postgres logs ==="
          docker compose logs postgres --tail=20 || true
          echo "=== keycloak logs ==="
          docker compose --profile auth logs keycloak --tail=30 || true

      - name: Clean up Compose services
        if: always()
        run: docker compose --profile auth down --remove-orphans

  # ===========================================================================
  # SECTION 2: CD DEPLOYMENT (Runs ONLY on push to main after CI passes)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Job 6: Parallel Docker Image Build & Push with Layer Caching
  # ---------------------------------------------------------------------------
  build-images:
    name: Build & Push (${{ matrix.service }})
    needs: integration-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development

    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: apps/backend/Dockerfile
          - service: frontend
            dockerfile: apps/frontend/Dockerfile
          - service: ai-service
            dockerfile: apps/ai-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 416.0.0'
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.AR_LOCATION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image with Buildx layer caching
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: ${{ vars.AR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}-${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Job 7: Deploy to GCP Development VM via IAP SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Development VM
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      AR_LOCATION: ${{ vars.AR_LOCATION }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      GCE_VM_NAME: ${{ vars.GCE_VM_NAME }}
      GCE_ZONE: ${{ vars.GCE_ZONE }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      TLS_ADMIN_EMAIL: ${{ vars.TLS_ADMIN_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Validate deployment configuration
        run: |
          set -eu
          for required in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOYER_SERVICE_ACCOUNT \
            AR_LOCATION \
            AR_REPOSITORY \
            GCE_VM_NAME \
            GCE_ZONE \
            DEPLOY_PATH \
            TLS_ADMIN_EMAIL; do
            if [ -z "${!required}" ]; then
              echo "Missing GitHub Actions variable: $required" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 416.0.0'
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Pull immutable images and deploy on the VM
        run: |
          set -eu
          IMAGE_PREFIX="${AR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}"
          REMOTE_SCRIPT=$(cat <<EOF
          set -eu
          test -d '$DEPLOY_PATH/.git'
          cd '$DEPLOY_PATH'
          git fetch --prune origin
          git checkout --force main
          git reset --hard origin/main
          gcloud auth configure-docker '${AR_LOCATION}-docker.pkg.dev' --quiet
          export BACKEND_IMAGE='$IMAGE_PREFIX/backend:${GITHUB_SHA}-${GITHUB_RUN_ID}'
          export FRONTEND_IMAGE='$IMAGE_PREFIX/frontend:${GITHUB_SHA}-${GITHUB_RUN_ID}'
          export AI_SERVICE_IMAGE='$IMAGE_PREFIX/ai-service:${GITHUB_SHA}-${GITHUB_RUN_ID}'
          export TLS_ADMIN_EMAIL='$TLS_ADMIN_EMAIL'
          COMPOSE_FILES='-f compose.yaml -f infra/docker/compose.images.yaml'
          if [ -f .env.cloud-sql ]; then
            COMPOSE_FILES="\$COMPOSE_FILES -f infra/docker/compose.cloud-sql.yaml"
            docker compose --env-file .env.cloud-sql \$COMPOSE_FILES pull
            docker compose --profile web --env-file .env.cloud-sql \$COMPOSE_FILES up -d --no-build cloud-sql-proxy backend ai-service frontend caddy
            docker compose --env-file .env.cloud-sql \$COMPOSE_FILES exec -T backend npm run db:check --workspace=apps/backend
          else
            docker compose \$COMPOSE_FILES pull
            docker compose --profile web \$COMPOSE_FILES up -d --no-build postgres backend ai-service frontend caddy
          fi
          docker compose --profile web \$COMPOSE_FILES ps
          echo "=== Cleaning up unused/dangling Docker images on VM ==="
          docker image prune -af --filter "until=72h" || true
          EOF
          )
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)"
          gcloud compute ssh "$GCE_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCE_ZONE" \
            --tunnel-through-iap \
            --command="echo '$REMOTE_SCRIPT_B64' | base64 -d | bash"
