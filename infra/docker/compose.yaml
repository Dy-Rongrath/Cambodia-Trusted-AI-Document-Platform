name: trusted-ai-platform

services:
  postgres:
    image: postgres:17.4-alpine
    container_name: trusted-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trusted_ai_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trusted_ai_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-trusted_ai_db}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-trusted_ai_dev} -d $${POSTGRES_DB:-trusted_ai_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL has NO published host port — internal network only.
    networks:
      - internal-net

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: trusted-ai-backend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trusted_ai_dev}:${POSTGRES_PASSWORD:-trusted_ai_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-trusted_ai_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../../apps/backend/src
          target: /app/apps/backend/src
        - action: rebuild
          path: ../../apps/backend/package.json
        - action: rebuild
          path: ../../package-lock.json
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal-net

  ai-service:
    build:
      context: ../..
      dockerfile: apps/ai-service/Dockerfile
      target: development
    container_name: trusted-ai-service
    restart: unless-stopped
    # AI service has NO published host port — internal network only.
    develop:
      watch:
        - action: sync
          path: ../../apps/ai-service/src
          target: /app/apps/ai-service/src
        - action: rebuild
          path: ../../apps/ai-service/pyproject.toml
        - action: rebuild
          path: ../../apps/ai-service/uv.lock
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/health")'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal-net

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      target: development
    container_name: trusted-ai-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-4200}:4200'
    develop:
      watch:
        - action: sync
          path: ../../apps/frontend/src
          target: /app/apps/frontend/src
        - action: rebuild
          path: ../../apps/frontend/package.json
        - action: rebuild
          path: ../../package-lock.json
    networks:
      - internal-net

  keycloak:
    profiles:
      - auth
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: trusted-ai-keycloak
    command: start-dev
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8080}:8080'
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password_change_me}
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      # Enable health endpoints on management port 9000
      KC_HEALTH_ENABLED: 'true'
    # Healthcheck uses built-in /dev/tcp to probe the management port 9000
    # (Keycloak image has no curl/wget — use bash TCP pseudo-device)
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -m 1 '"status":"UP"' <&3 &&
          exec 3>&-
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
